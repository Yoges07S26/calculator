<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f4f4;
      font-family: sans-serif;
    }

    .calculator {
      width: 320px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      padding: 20px;
    }

    .display {
      width: 100%;
      height: 60px;
      font-size: 28px;
      text-align: right;
      padding: 10px;
      background: #f9f9f9;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 15px;
      color: #333;
      overflow: hidden;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .btn {
      padding: 18px;
      font-size: 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #f0f0f0;
      transition: background 0.2s;
    }

    .btn:hover { background: #ddd; }
    .btn:active { background: #bbb; }

    .btn.number { background: #fff; color: #333; }

    .btn.operator { background: #f9a825; color: #fff; }
    .btn.operator:hover { background: #f57f17; }

    .btn.clear { background: #d32f2f; color: #fff; }
    .btn.clear:hover { background: #b71c1c; }

    .btn.equals { background: #388e3c; color: #fff; }
    .btn.equals:hover { background: #2c6b2f; }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="btn clear">C</button>
      <button class="btn operator">÷</button>
      <button class="btn operator">×</button>
      <button class="btn operator">−</button>

      <button class="btn number">7</button>
      <button class="btn number">8</button>
      <button class="btn number">9</button>
      <button class="btn operator">+</button>

      <button class="btn number">4</button>
      <button class="btn number">5</button>
      <button class="btn number">6</button>
      <button class="btn equals">=</button>

      <button class="btn number">1</button>
      <button class="btn number">2</button>
      <button class="btn number">3</button>
      <button class="btn number" style="grid-row: span 2;">0</button>

      <button class="btn number">.</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    const buttons = document.querySelectorAll('.btn');

    let current = '0';
    let previous = '';
    let operator = null;
    let shouldReset = false;

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        const value = btn.textContent;

        if (value >= '0' && value <= '9' || value === '.') {
          if (shouldReset) {
            current = value === '.' ? '0.' : value;
            shouldReset = false;
          } else {
            if (value === '.' && current.includes('.')) return;
            current = current === '0' && value !== '.' ? value : current + value;
          }
        }
        else if (['+', '−', '×', '÷'].includes(value)) {
          previous = current;
          operator = value;
          shouldReset = true;
        }
        else if (value === 'C') {
          current = '0';
          previous = '';
          operator = null;
          shouldReset = false;
        }
        else if (value === '=') {
          if (operator && previous !== '') {
            const a = parseFloat(previous);
            const b = parseFloat(current);
            let result;

            switch (operator) {
              case '+': result = a + b; break;
              case '−': result = a - b; break;
              case '×': result = a * b; break;
              case '÷': result = b !== 0 ? a / b : 'Error'; break;
            }

            current = String(result);
            operator = null;
            previous = '';
            shouldReset = true;
          }
        }

        display.textContent = current;
      });
    });
  </script>
</body>
</html>
