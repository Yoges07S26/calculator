
<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: lightblue;
        }

        .calculator {
            width: 280px;
            margin: 80px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }

        input {
            width: 95%;
            height: 40px;
            margin-bottom: 10px;
            font-size: 22px;
            text-align: right;
        }

        button {
            width: 55px;
            height: 45px;
            margin: 3px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            background: lightgray;
            border-radius: 5px;
        }

        button:hover {
            background: orange;
        }

        .equal { background: lightgreen; }
        .clear { background: lightcoral; }
    </style>
</head>
<body>

<div class="calculator">
    <h2>Calculator</h2>
    <input type="text" id="display" readonly>

    <br>
    <button class="clear" onclick="clearDisplay()">C</button>
    <button onclick="add('/')">÷</button>
    <button onclick="add('*')">×</button>
    <button onclick="add('-')">−</button><br>

    <button onclick="add('7')">7</button>
    <button onclick="add('8')">8</button>
    <button onclick="add('9')">9</button>
    <button onclick="add('+')">+</button><br>

    <button onclick="add('4')">4</button>
    <button onclick="add('5')">5</button>
    <button onclick="add('6')">6</button>
    <button onclick="add('1')">1</button><br>

    <button onclick="add('2')">2</button>
    <button onclick="add('3')">3</button>
    <button onclick="add('0')">0</button>
    <button onclick="add('.')">.</button><br>

    <button class="equal" onclick="calculate()">=</button>
</div>

<script>
    let display = document.getElementById("display");

    function add(value) {
        display.value += value;
    }

    function addition(a, b) {
        return a + b;
    }

    function subtraction(a, b) {
        return a - b;
    }

    function multiplication(a, b) {
        return a * b;
    }

    function division(a, b) {
        if (b === 0) {
            throw new Error("Cannot divide by zero");
        }
        return a / b;
    }

    function calculate() {
        try {
            let expression = display.value;

            if (!expression ||
                !/^\d*\.?\d+(?:[+\-*/]\d*\.?\d+)*$/.test(expression)) {
                throw new Error("Invalid");
            }

            let numbers = expression.match(/\d*\.?\d+/g).map(Number);
            let operators = expression.match(/[+\-*/]/g) || [];

            for (let i = 0; i < operators.length;) {
                if (operators[i] === "*" || operators[i] === "/") {
                    let result = operators[i] === "*"
                        ? multiplication(numbers[i], numbers[i + 1])
                        : division(numbers[i], numbers[i + 1]);

                    numbers.splice(i, 2, result);
                    operators.splice(i, 1);
                } else {
                    i++;
                }
            }

            let result = numbers[0];

            for (let i = 0; i < operators.length; i++) {
                if (operators[i] === "+") {
                    result = addition(result, numbers[i + 1]);
                } else {
                    result = subtraction(result, numbers[i + 1]);
                }
            }

            display.value = Number.isFinite(result) ? result : "Error";
        } catch (error) {
            display.value = error.message === "Cannot divide by zero"
                ? error.message : "Error";
        }
    }

    function clearDisplay() {
        display.value = "";
    }

    document.addEventListener("keydown", function(event) {
        if (/^[0-9.+*/-]$/.test(event.key)) {
            add(event.key);
        } else if (event.key === "Enter") {
            calculate();
        } else if (event.key === "Escape") {
            clearDisplay();
        } else if (event.key === "Backspace") {
            display.value = display.value.slice(0, -1);
        }
    });
</script>

</body>
</html>
